<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--card:#fff;--ink:#161616;--mute:#8b8b86;--line:#ececE7;--soft:#f4f4f0;--acc:#161616;--accfg:#fff;--neg:#c0533d;--pos:#2e7d5b;--warn:#b7822a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--card:#181817;--ink:#ececE8;--mute:#8a8a85;--line:#272725;--soft:#1f1f1d;--acc:#ececE8;--accfg:#111;--neg:#f0907b;--pos:#6fcf9f;--warn:#e0b25c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#181817;--ink:#ececE8;--mute:#8a8a85;--line:#272725;--soft:#1f1f1d;--acc:#ececE8;--accfg:#111;--neg:#f0907b;--pos:#6fcf9f;--warn:#e0b25c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font:600 20px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
nav,.seg{display:inline-flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
nav button,.seg button{border:0;background:none;color:var(--mute);padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
nav button.on,.seg button.on{background:var(--acc);color:var(--accfg)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.stats>div+div{border-left:1px solid var(--line);padding-left:18px}
.big{font:300 28px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:13px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.h{font-weight:600;font-size:15px;margin:0 0 14px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.b{cursor:pointer}button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td.d{white-space:normal;min-width:180px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.drop{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
.drop:hover{border-color:var(--ink)}
.lg{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;font-weight:700;letter-spacing:-.02em;flex:none;line-height:1;font-family:system-ui,"Segoe UI",sans-serif}
.bn{display:inline-flex;align-items:center;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.bar{display:grid;grid-template-columns:1fr auto 16px;gap:8px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:inherit;font:inherit;cursor:pointer}
.bar small{color:var(--mute);margin-left:6px;font-size:12px}
.bar .bv{font-variant-numeric:tabular-nums}
.bar .cv{color:var(--mute);transition:transform .2s;font-size:12px}
.bar[aria-expanded="true"] .cv{transform:rotate(90deg)}
.trk{grid-column:1/-1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--acc);border-radius:2px}
.det{padding:6px 0 14px;border-bottom:1px solid var(--line)}
.grp{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.grp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}
.gi{flex:1;min-width:0}
.gi .trk{height:3px;margin-top:6px}
.pill{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:1px}
.tl{border-top:1px solid var(--line);padding:4px 14px 8px}
.tl div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13px}
.tl div span:first-child{color:var(--mute);flex:none;width:44px}
.tl div span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.tl .n{font-variant-numeric:tabular-nums}
.q{font-weight:600;margin-bottom:12px}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:12px 0 16px}
.meter i{display:block;height:100%;border-radius:3px}
.ok{background:var(--pos)}.wn{background:var(--warn)}.hi{background:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pct{font:300 34px/1.1 system-ui,-apple-system,sans-serif;letter-spacing:-.02em}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.ent{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ent button{padding:2px 9px;cursor:pointer}
nav{max-width:100%;overflow-x:auto}nav button{white-space:nowrap}
.mny{width:150px}
input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px;flex:none;margin:0}
.pjr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.pjn{flex:1}.pjv{font-variant-numeric:tabular-nums;color:var(--mute)}
.pjr input:checked+.pjn{color:var(--mute);text-decoration:line-through}
nav button[data-t=pj]::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:7px;vertical-align:1px}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stats.s3 .big{font-size:clamp(20px,3.6vw,28px)}
.split{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sbar{display:flex;gap:3px;height:6px;margin-bottom:12px}
.sbar i{display:block;height:100%;border-radius:3px;min-width:4px}
.sbar .f,.dot.f{background:var(--acc)}
.sbar .c,.dot.c{background:var(--mute);opacity:.45}
.srow{display:grid;grid-template-columns:10px 1fr auto 40px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.srow b{font-weight:500;font-variant-numeric:tabular-nums}
.srow .mute{text-align:right}
.dot{width:8px;height:8px;border-radius:50%}
@media(max-width:640px){.stats.s3{grid-template-columns:1fr;gap:12px}.stats.s3>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.stats.s3>div+div{border-left:0;padding-left:0}.stats.s3 .big{font-size:22px}}
body{transition:background .25s,color .25s}
body.pj{--bg:#f5f1fc;--card:#fff;--ink:#1d1530;--mute:#7d7296;--line:#e5dcf4;--soft:#eee7f9;--acc:#6d3fc0;--accfg:#fff;--pos:#2e7d5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.pj{--bg:#140e22;--card:#1b1430;--ink:#eee8fa;--mute:#9b8fb8;--line:#2d2347;--soft:#241a3c;--acc:#b794f6;--accfg:#140e22}}
:root[data-theme="dark"] body.pj{--bg:#140e22;--card:#1b1430;--ink:#eee8fa;--mute:#9b8fb8;--line:#2d2347;--soft:#241a3c;--acc:#b794f6;--accfg:#140e22}
#modal,#cmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on,#cmodal.on{display:flex}
#modal .box,#cmodal .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px;width:100%}
#modal .box p,#cmodal .box p{margin:0 0 6px}
#modal .acts,#cmodal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
button.danger{background:var(--neg);border-color:var(--neg);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:560px){.stats>div+div{border-left:0;padding-left:0}main{padding:20px 14px 50px}
.card{padding:18px 16px}.big{font-size:24px}
.fld{flex:1 1 140px;min-width:0}.fld select,.fld input{width:100%}
#en,#sn{flex:1 1 100%!important}#ev,#sv{width:auto!important;flex:1 1 120px;min-width:0}
.row select,.row input{max-width:100%;min-width:0}
.ent{flex-wrap:wrap}.ent .gi{flex:1 1 120px}
.grp summary{padding:10px 12px;gap:10px}}
input,select{max-width:100%}
</style>

<body>
<main>
<header><h1>Minhas contas</h1>
<nav id="nav"><button data-t="res" class="on">Resumo</button><button data-t="in">Entradas</button><button data-t="out">Saídas</button><button data-t="cmp">Comparativo</button><button data-t="tx">Transações</button><button data-t="imp">Importar</button><button data-t="pj">PJ</button></nav></header>
<div id="v"></div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt1"><div class="box"><p id="mt1" style="font-weight:600">Apagar todos os dados?</p><p class="mute">Todas as transações, entradas, saídas, categorias criadas e dados do PJ serão removidos deste navegador. Esta ação não pode ser desfeita. Baixe um backup antes, se quiser guardar os dados.</p><div class="acts"><button class="b" id="mno">Cancelar</button><button class="b danger" id="myes">Apagar tudo</button></div></div></div>
<div id="cmodal" role="dialog" aria-modal="true" aria-labelledby="ct1"><div class="box"><p id="ct1" style="font-weight:600">Nova categoria</p><p class="mute">Dê um nome para a categoria.</p><input id="cn" maxlength="30" placeholder="Ex.: Pet" style="width:100%"><p id="cerr" class="neg" style="margin:6px 0 0;font-size:13px"></p><div class="acts"><button class="b" id="cno">Cancelar</button><button class="b p" id="cyes">Criar</button></div></div></div>
<div id="toast"></div>
<script>
const KEY='contas_v1';
const CATS=['Alimentação','Mercado','Transporte','Moradia','Saúde','Lazer','Assinaturas','Educação','Compras','Renda','Pagamento de fatura','Outros','Sem categoria'];
const IGN='Pagamento de fatura';
const RULES=[[/fatura|pagamento recebido|pgto fatura|pagamento de fatura/i,IGN],[/uber|99 ?pop|posto|combust|estaciona|sem parar/i,'Transporte'],[/ifood|restaur|lanche|padaria|pizza|burger|cafe|café/i,'Alimentação'],[/mercado|supermerc|atacad|assai|carrefour|extra /i,'Mercado'],[/netflix|spotify|prime|youtube|disney|hbo|icloud|google one/i,'Assinaturas'],[/farmac|drog|raia|pacheco|hospital|clinica|clínica/i,'Saúde'],[/sal[aá]rio|folha pgto|proventos/i,'Renda']];
let S={tx:[]},tab='res',month='all',q='',srcF='all',P=null,selCat='all',openCat=null;
const fixS=()=>{S.inc=Array.isArray(S.inc)?S.inc:[];S.out=Array.isArray(S.out)?S.out:[];S.cats=Array.isArray(S.cats)?S.cats:[];S.pj=Array.isArray(S.pj)?S.pj:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.tx=S.tx.filter(t=>t.amt!==0);fixS();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar no navegador')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
