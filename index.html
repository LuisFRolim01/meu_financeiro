<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas contas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--card:#fff;--ink:#161616;--mute:#8b8b86;--line:#ececE7;--soft:#f4f4f0;--acc:#161616;--accfg:#fff;--neg:#c0533d;--pos:#2e7d5b;--warn:#b7822a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--card:#181817;--ink:#ececE8;--mute:#8a8a85;--line:#272725;--soft:#1f1f1d;--acc:#ececE8;--accfg:#111;--neg:#f0907b;--pos:#6fcf9f;--warn:#e0b25c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#181817;--ink:#ececE8;--mute:#8a8a85;--line:#272725;--soft:#1f1f1d;--acc:#ececE8;--accfg:#111;--neg:#f0907b;--pos:#6fcf9f;--warn:#e0b25c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font:600 20px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
nav,.seg{display:inline-flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
nav button,.seg button{border:0;background:none;color:var(--mute);padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
nav button.on,.seg button.on{background:var(--acc);color:var(--accfg)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.stats>div+div{border-left:1px solid var(--line);padding-left:18px}
.big{font:300 28px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:13px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.h{font-weight:600;font-size:15px;margin:0 0 14px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.b{cursor:pointer}button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td.d{white-space:normal;min-width:180px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.drop{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
.drop:hover{border-color:var(--ink)}
.lg{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;font-weight:700;letter-spacing:-.02em;flex:none;line-height:1;font-family:system-ui,"Segoe UI",sans-serif}
.bn{display:inline-flex;align-items:center;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.bar{display:grid;grid-template-columns:1fr auto 16px;gap:8px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:inherit;font:inherit;cursor:pointer}
.bar small{color:var(--mute);margin-left:6px;font-size:12px}
.bar .bv{font-variant-numeric:tabular-nums}
.bar .cv{color:var(--mute);transition:transform .2s;font-size:12px}
.bar[aria-expanded="true"] .cv{transform:rotate(90deg)}
.trk{grid-column:1/-1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--acc);border-radius:2px}
.det{padding:6px 0 14px;border-bottom:1px solid var(--line)}
.grp{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.grp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.grp summary::-webkit-details-marker{display:none}
.gi{flex:1;min-width:0}
.gi .trk{height:3px;margin-top:6px}
.pill{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:1px}
.tl{border-top:1px solid var(--line);padding:4px 14px 8px}
.tl div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13px}
.tl div span:first-child{color:var(--mute);flex:none;width:44px}
.tl div span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.tl .n{font-variant-numeric:tabular-nums}
.q{font-weight:600;margin-bottom:12px}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:12px 0 16px}
.meter i{display:block;height:100%;border-radius:3px}
.ok{background:var(--pos)}.wn{background:var(--warn)}.hi{background:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pct{font:300 34px/1.1 system-ui,-apple-system,sans-serif;letter-spacing:-.02em}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.ent{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ent button{padding:2px 9px;cursor:pointer}
nav{max-width:100%;overflow-x:auto}nav button{white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px;width:100%}
#modal .box p{margin:0 0 6px}
#modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
button.danger{background:var(--neg);border-color:var(--neg);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:560px){.stats>div+div{border-left:0;padding-left:0}main{padding:20px 14px 50px}}
</style>
</head>
<body>
<main>
<header><h1>Minhas contas</h1>
<nav id="nav"><button data-t="res" class="on">Resumo</button><button data-t="in">Entradas</button><button data-t="out">Saídas</button><button data-t="cmp">Comparativo</button><button data-t="tx">Transações</button><button data-t="imp">Importar</button></nav></header>
<div id="v"></div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt1"><div class="box"><p id="mt1" style="font-weight:600">Apagar todos os dados?</p><p class="mute">Todas as transações e o valor de entrada serão removidos deste navegador. Esta ação não pode ser desfeita. Baixe um backup antes, se quiser guardar os dados.</p><div class="acts"><button class="b" id="mno">Cancelar</button><button class="b danger" id="myes">Apagar tudo</button></div></div></div>
<div id="toast"></div>
<script>
const KEY='contas_v1';
const CATS=['Alimentação','Mercado','Transporte','Moradia','Saúde','Lazer','Assinaturas','Educação','Compras','Renda','Pagamento de fatura','Outros','Sem categoria'];
const IGN='Pagamento de fatura';
const RULES=[[/fatura|pagamento recebido|pgto fatura|pagamento de fatura/i,IGN],[/uber|99 ?pop|posto|combust|estaciona|sem parar/i,'Transporte'],[/ifood|restaur|lanche|padaria|pizza|burger|cafe|café/i,'Alimentação'],[/mercado|supermerc|atacad|assai|carrefour|extra /i,'Mercado'],[/netflix|spotify|prime|youtube|disney|hbo|icloud|google one/i,'Assinaturas'],[/farmac|drog|raia|pacheco|hospital|clinica|clínica/i,'Saúde'],[/sal[aá]rio|folha pgto|proventos/i,'Renda']];
let S={tx:[]},tab='res',month='all',q='',srcF='all',P=null,selCat='all',openCat=null;
const fixS=()=>{S.inc=Array.isArray(S.inc)?S.inc:[];S.out=Array.isArray(S.out)?S.out:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.tx=S.tx.filter(t=>t.amt!==0);fixS();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar no navegador')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)}
function mapBank(c){c=c||'';const R=[[/restaur|lanch|\bbar\b/i,'Alimentação'],[/supermerc|mercear|padaria|conveni/i,'Mercado'],[/transporte|automotiv|T&E|combust/i,'Transporte'],[/telecom|el[eé]trico|energia|[aá]gua|g[aá]s/i,'Moradia'],[/sa[uú]de|farm|hospital/i,'Saúde'],[/varejo|departamento|desconto|marketing|vestu/i,'Compras'],[/educa|escola|livr/i,'Educação'],[/entreten|lazer|hotel|viage/i,'Lazer']];for(const[r,k]of R)if(r.test(c))return k;return null}
function guess(d){for(const[r,c]of RULES)if(r.test(d))return c;return 'Sem categoria'}
async function readFile(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1252').decode(b)}}
function pNum(s){s=String(s).replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
function pDate(s){s=String(s).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=m[3].length==2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return null}
function parseOFX(t){const out=[];t.split(/<STMTTRN>/i).slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
const d=g('DTPOSTED').slice(0,8);const a=parseFloat(g('TRNAMT').replace(',','.'));if(d.length<8||isNaN(a))return;
out.push({date:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),desc:g('MEMO')||g('NAME')||'(sem descrição)',amt:a,fitid:g('FITID')})});return out}
function parseCSV(t,del){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==del){r.push(c);c=''}else if(ch=='\n'){r.push(c.replace(/\r$/,''));rows.push(r);r=[];c=''}else c+=ch}
if(c||r.length){r.push(c.replace(/\r$/,''));rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function addTx(list,src){const have=new Set(S.tx.map(t=>t.key));let n=0,dup=0;
list.forEach(t=>{const key=src+'|'+(t.fitid||t.date+'|'+norm(t.desc)+'|'+t.amt.toFixed(2));
if(have.has(key)&&!t.fitid){/* mesma linha repetida no mesmo arquivo é permitida abaixo */}
if(S.tx.some(x=>x.key===key&&x.batch!==P_BATCH)){dup++;return}
S.tx.push({id:Math.random().toString(36).slice(2),key:key,batch:P_BATCH,date:t.date,ref:t.ref,desc:t.desc,amt:t.amt,src:src,bank:t.bank,cat:t.cat||guess(t.desc)});n++});
save();return[n,dup]}
let P_BATCH='';
const mo=t=>t.ref||t.date.slice(0,7);
function months(){return[...new Set(T().map(mo))].sort().reverse()}
function filtered(){return S.tx.filter(t=>(month=='all'||mo(t)==month)&&(srcF=='all'||t.src==srcF)&&(!q||norm(t.desc).includes(norm(q)))).sort((a,b)=>b.date.localeCompare(a.date))}
function monthSel(){return `<select id="fm"><option value="all">Todos os meses</option>${months().map(m=>`<option ${m==month?'selected':''} value="${m}">${mFull(m)}</option>`).join('')}</select>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
$('#v').innerHTML=tab=='res'?vRes():tab=='in'?vEnt():tab=='out'?vSai():tab=='cmp'?vCmp():tab=='tx'?vTx():vImp();}
const BANKS=['Inter','Nubank','C6','Outro'];
const bankOpts=()=>BANKS.map(b=>`<option>${b}</option>`).join('');
const bankOf=t=>t.bank||(/inter/i.test(t.src)?'Inter':/nubank|nu\b/i.test(t.src)?'Nubank':/c6/i.test(t.src)?'C6':'Outro');
const BRAND={Inter:['#ff7a00','#fff','inter',.31],Nubank:['#820ad1','#fff','nu',.46],C6:['#1b1b1b','#e9e9e9','C6',.4]};
function logo(b,s){s=s||28;const k=BRAND[b];if(k)return `<span class="lg" style="width:${s}px;height:${s}px;background:${k[0]};color:${k[1]};font-size:${Math.round(s*k[3])}px" title="${esc(b)}">${k[2]}</span>`;
return `<span class="lg" style="width:${s}px;height:${s}px;background:var(--soft);color:var(--mute)" title="${esc(b)}"><svg viewBox="0 0 24 24" width="56%" height="56%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg></span>`}
function maskMoney(v){v=String(v).replace(/[^\d,]/g,'');const i=v.indexOf(',');let a=i<0?v:v.slice(0,i),b=i<0?null:v.slice(i+1).replace(/,/g,'').slice(0,2);a=a.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');return b===null?a:(a||'0')+','+b}
function pMoney(s){s=String(s||'').replace(/[R$\s]/g,'');if(!s)return NaN;if(!s.includes(',')&&/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return pNum(s)}
function vBank(){const R={};TX().filter(t=>(month=='all'||mo(t)==month)&&t.cat!=IGN).forEach(t=>{const o=R[bankOf(t)]=R[bankOf(t)]||{ei:0,es:0,f:0};if(t.src.startsWith('Cartão'))o.f+=-t.amt;else if(t.amt>0)o.ei+=t.amt;else o.es+=-t.amt});
const ks=BANKS.filter(b=>R[b]);const T={ei:0,es:0,f:0};ks.forEach(b=>{for(const k in T)T[k]+=R[b][k]});
const row=(n,o,s)=>`<tr${s?' style="font-weight:600"':''}><td>${s?n:`<span class="bn">${logo(n,26)}${n}</span>`}</td><td class="n pos">${brl(o.ei)}</td><td class="n neg">${brl(o.es)}</td><td class="n neg">${brl(o.f)}</td><td class="n neg">${brl(o.es+o.f)}</td></tr>`;
return `<div class="card tw"><p class="h">Por banco</p><table><tr><th>Banco</th><th class="n">Entradas</th><th class="n">Saídas na conta</th><th class="n">Fatura do cartão</th><th class="n">Total gasto</th></tr>${ks.map(b=>row(b,R[b])).join('')}${ks.length>1?row('Total',T,1):''}</table></div>`}
function resData(){const l=filteredAll().filter(t=>t.cat!=IGN);const inc=l.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0),exp=l.filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0);
const by={};l.filter(t=>t.amt<0).forEach(t=>by[t.cat]=(by[t.cat]||0)+-t.amt);const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);return{l,inc,exp,e}}
function byCard(l,c){const G={};l.filter(t=>t.cat==c&&t.amt<0).forEach(t=>{const b=bankOf(t),k=t.man?t.met:(t.src.startsWith('Cartão')?'Cartão':'Conta');const key=b+'|'+k;const g=G[key]=G[key]||{b,k,v:0,items:[]};g.v+=-t.amt;g.items.push(t)});return Object.values(G).sort((a,b)=>b.v-a.v)}
function vDet(d,c,v){const base=d.inc>0?d.inc:0;const gs=byCard(d.l,c);
return `<div class="det">${base?`<p class="mute" style="margin:0 0 6px">${(v/base*100).toFixed(1)}% da entrada</p>`:''}${gs.map(g=>`<details class="grp"><summary>${logo(g.b,34)}<div class="gi"><div>${esc(g.b)}<span class="pill">${g.k=='Cartão'?'Cartão de crédito':g.k=='Conta'?'Conta':esc(g.k)}</span></div><div class="trk"><i style="width:${g.v/v*100}%"></i></div></div><div style="text-align:right"><div style="font-variant-numeric:tabular-nums">${brl(g.v)}</div><div class="mute">${(g.v/v*100).toFixed(0)}%</div></div></summary>
<div class="tl">${g.items.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(t=>`<div><span>${t.date.slice(8)}/${t.date.slice(5,7)}</span><span>${esc(t.desc)}</span><span class="n">${brl(-t.amt)}</span></div>`).join('')}${g.items.length>60?`<p class="mute">Mostrando 60 de ${g.items.length}. Veja todos em Transações.</p>`:''}</div></details>`).join('')}</div>`}
function vCats(d){const tot=-d.exp;if(selCat!='all'&&!d.e.some(x=>x[0]==selCat))selCat='all';
const list=selCat=='all'?d.e:d.e.filter(x=>x[0]==selCat);
const chips=`<div class="chips"><button class="chip ${selCat=='all'?'on':''}" data-chip="all">Todas</button>${d.e.map(([c])=>`<button class="chip ${selCat==c?'on':''}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
return `<div class="card"><p class="h">Gastos por categoria</p>${d.e.length?chips:''}${list.map(([c,v])=>`<button class="bar" data-cat="${esc(c)}" aria-expanded="${openCat==c}"><span>${esc(c)}<small>${(v/tot*100).toFixed(0)}%</small></span><span class="bv">${brl(v)}</span><span class="cv">▸</span><span class="trk"><i style="width:${v/tot*100}%"></i></span></button>${openCat==c?vDet(d,c,v):''}`).join('')||'<p class="mute">Sem gastos no período.</p>'}
<p class="mute" style="margin:14px 0 0">Toque em uma categoria para ver os gastos divididos por cartão. Pagamentos de fatura ficam fora dos totais para não contar o gasto duas vezes.</p></div>`}
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mFull=m=>{const n=MN[+m.slice(5)-1];return n[0].toUpperCase()+n.slice(1)+' '+m.slice(0,4)};
const mShort=m=>MN[+m.slice(5)-1].slice(0,3)+'/'+m.slice(2,4);
const brl0=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
let cmpCat='all';
function refOpts(){const o=['<option value="">Selecione o mês…</option>'];const n=new Date();for(let i=-1;i<18;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');o.push(`<option value="${m}">${mFull(m)}</option>`)}return o.join('')}
function mStats(){const M={};T().filter(t=>t.cat!=IGN).forEach(t=>{const m=mo(t);const o=M[m]=M[m]||{inc:0,exp:0,cat:{},bank:{}};if(t.amt>0)o.inc+=t.amt;else{const v=-t.amt;o.exp+=v;o.cat[t.cat]=(o.cat[t.cat]||0)+v;const b=bankOf(t);o.bank[b]=(o.bank[b]||0)+v}});return M}
function delta(c,p){if(!p)return '<span class="mute">—</span>';const d=(c-p)/p*100;if(Math.abs(d)<.5)return '<span class="mute">0%</span>';const up=d>0;return `<span class="${up?'neg':'pos'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</span>`}
function chart(ms,M,cat){const W=640,H=250,pt=28,pb=30,all=cat=='all';
const vals=ms.map(m=>({m,e:all?M[m].inc:0,s:all?M[m].exp:(M[m].cat[cat]||0)}));
const line=0;
